name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Every job runs on each maintained LTS line the package supports
  # (`engines.node` in package.json). Node 22 is the deploy target — it is what
  # the Dockerfile ships — and Node 24 is the next LTS, so a regression there
  # surfaces on the PR that causes it instead of on the upgrade PR months later.
  #
  # Warnings are failures throughout:
  #   * `pnpm lint` runs ESLint with `--max-warnings 0`.
  #   * `.npmrc` sets `strict-peer-dependencies` and `engine-strict`, so a peer
  #     mismatch or an unsupported runtime fails `pnpm install` rather than
  #     printing a warning nobody reads.
  #   * `NODE_OPTIONS=--throw-deprecation` turns Node runtime deprecation
  #     warnings into thrown errors. It is set per step, never at job level:
  #     the JS actions above run on the runner's own Node and must not inherit
  #     it.
  lint:
    name: Lint (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
        env:
          NODE_OPTIONS: --throw-deprecation
      - run: pnpm format:check
        env:
          NODE_OPTIONS: --throw-deprecation

  typecheck:
    name: Type Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `tsc` needs the generated client for `@prisma/client` types.
      - run: pnpm db:generate
      - run: pnpm typecheck
        env:
          NODE_OPTIONS: --throw-deprecation

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${{ secrets.CI_AWS_ACCESS_KEY_ID || 'test' }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_AWS_SECRET_ACCESS_KEY || 'test' }}
      S3_BUCKET: ${{ secrets.CI_S3_BUCKET || 'test-bucket' }}
      GOOGLE_CLIENT_ID: ${{ secrets.CI_GOOGLE_CLIENT_ID || 'test-client-id' }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.CI_GOOGLE_CLIENT_SECRET || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate ephemeral CI secrets
        run: |
          printf 'JWT_SECRET=%s\n' "$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          printf 'JWT_REFRESH_SECRET=%s\n' "$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm test:cov
        env:
          NODE_OPTIONS: --throw-deprecation
      - run: pnpm test:e2e
        env:
          NODE_OPTIONS: --throw-deprecation
      - run: pnpm build
        env:
          NODE_OPTIONS: --throw-deprecation
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          # upload-artifact@v4 rejects duplicate names, so each matrix leg
          # uploads its own coverage report.
          name: coverage-node-${{ matrix.node }}
          path: coverage/
          retention-days: 7

  build:
    # Builds on every pull request and pushes only from main. The build used to
    # be main-only, which meant a broken Dockerfile could not fail a PR and only
    # turned main red after merge.
    name: Docker Image
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
