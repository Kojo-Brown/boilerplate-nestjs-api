name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Every job runs on each maintained LTS line the package supports
  # (`engines.node` in package.json). Node 22 is the deploy target — it is what
  # the Dockerfile ships — and Node 24 is the next LTS, so a regression there
  # surfaces on the PR that causes it instead of on the upgrade PR months later.
  #
  # Warnings are failures throughout:
  #   * `pnpm lint` runs ESLint with `--max-warnings 0`.
  #   * `.npmrc` sets `strict-peer-dependencies` and `engine-strict`, so a peer
  #     mismatch or an unsupported runtime fails `pnpm install` rather than
  #     printing a warning nobody reads.
  #   * `NODE_OPTIONS=--throw-deprecation` turns Node runtime deprecation
  #     warnings into thrown errors. It is set per step, never at job level:
  #     the JS actions above run on the runner's own Node and must not inherit
  #     it.
  lint:
    name: Lint (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
        env:
          NODE_OPTIONS: --throw-deprecation
      - run: pnpm format:check
        env:
          NODE_OPTIONS: --throw-deprecation

  typecheck:
    name: Type Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `tsc` needs the generated client for `@prisma/client` types.
      - run: pnpm db:generate
      - run: pnpm typecheck
        env:
          NODE_OPTIONS: --throw-deprecation

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Three independent masters, because that is what Redlock is: the
      # distributed-lock contract runs its quorum legs against these, including
      # one with a node missing. A single service would only ever exercise the
      # degenerate one-node case, where a majority is trivially itself.
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
      redis2:
        image: redis:8-alpine
        ports:
          - 6380:6379
      redis3:
        image: redis:8-alpine
        ports:
          - 6381:6379
      # A real single-node KRaft broker, because three of the properties
      # `message-broker.contract.ts` asserts are properties of Kafka rather than
      # of the code in front of it: that a committed offset is the next one to
      # read, that a group's members get disjoint partitions, and that a
      # rejoining member resumes from what was committed. Against the in-memory
      # double alone they would be properties of a `Map`.
      #
      # `KAFKA_BROKERS` below is what switches the contract's Kafka leg on; the
      # spec reports it *pending* when unset rather than skipping green, so this
      # service going missing is visible in the run rather than silent.
      kafka:
        image: apache/kafka:3.9.1
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          # All three default to 3, which a one-node cluster cannot satisfy —
          # `__consumer_offsets` would fail to create and every commit with it.
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          # Otherwise every new consumer group in the contract waits 3s to be
          # assigned anything, on a suite that creates one group per spec.
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
          --health-start-period 20s
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379
      REDLOCK_NODES: redis://localhost:6379,redis://localhost:6380,redis://localhost:6381
      KAFKA_BROKERS: localhost:9092
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${{ secrets.CI_AWS_ACCESS_KEY_ID || 'test' }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_AWS_SECRET_ACCESS_KEY || 'test' }}
      S3_BUCKET: ${{ secrets.CI_S3_BUCKET || 'test-bucket' }}
      GOOGLE_CLIENT_ID: ${{ secrets.CI_GOOGLE_CLIENT_ID || 'test-client-id' }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.CI_GOOGLE_CLIENT_SECRET || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate ephemeral CI secrets
        run: |
          printf 'JWT_SECRET=%s\n' "$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          printf 'JWT_REFRESH_SECRET=%s\n' "$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      # Builds the schema from the migration history, which is also the only
      # thing that checks the history can build it. It could not until the
      # `20260701000000_init` migration was added: every migration in the
      # repository was an `ALTER TABLE` against tables nothing ever created, so
      # `migrate deploy` failed on a clean database and nobody found out,
      # because no job had ever run it.
      - run: pnpm db:migrate:prod
      - run: pnpm test:cov
        env:
          NODE_OPTIONS: --throw-deprecation
      - run: pnpm test:e2e
        env:
          NODE_OPTIONS: --throw-deprecation
      # Runs against the Postgres service above. The row-locking suites assert
      # properties of the database itself — that `FOR UPDATE` excludes a second
      # transaction, that `FOR KEY SHARE` conflicts with one lock mode and not
      # another — and none of it can be covered by the unit or e2e suites, both
      # of which run entirely on in-memory doubles.
      - run: pnpm test:db
        env:
          NODE_OPTIONS: --throw-deprecation
      - run: pnpm build
        env:
          NODE_OPTIONS: --throw-deprecation
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          # upload-artifact@v4 rejects duplicate names, so each matrix leg
          # uploads its own coverage report.
          name: coverage-node-${{ matrix.node }}
          path: coverage/
          retention-days: 7

  build:
    # Builds on every pull request and pushes only from main. The build used to
    # be main-only, which meant a broken Dockerfile could not fail a PR and only
    # turned main red after merge.
    name: Docker Image
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
