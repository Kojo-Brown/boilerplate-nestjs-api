version: "3.9"

# ─── Networks ──────────────────────────────────────────────────────────────────
networks:
  app-network:
    driver: bridge

# ─── Services ──────────────────────────────────────────────────────────────────
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    networks:
      - app-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-app_db}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    networks:
      - app-network
    # AOF persistence + sane memory cap so the container never OOMs
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Two more independent masters, so Redlock has a majority to vote over. They
  # deliberately do not replicate to each other or to `redis` above: nodes that
  # replicate are not a quorum, they are one node with copies, and a lock
  # acknowledged before replication is simply absent after a failover.
  #
  # No `allkeys-lru` here, unlike `redis`: evicting a lock key hands the lock to
  # somebody else, and evicting the fencing counter restarts the token sequence.
  # These hold locks only, so a memory cap they could reach would be a bug.
  redis2:
    image: redis:8-alpine
    restart: unless-stopped
    networks:
      - app-network
    command: redis-server --appendonly yes
    ports:
      - "${REDIS2_PORT:-6380}:6379"
    volumes:
      - redis2data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis3:
    image: redis:8-alpine
    restart: unless-stopped
    networks:
      - app-network
    command: redis-server --appendonly yes
    ports:
      - "${REDIS3_PORT:-6381}:6379"
    volumes:
      - redis3data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Single-node KRaft cluster: no ZooKeeper, and no replication to configure.
  # One node is right for a compose file and wrong for production — `acks=all`
  # on a single replica means "the one broker has it", so a lost disk is a lost
  # message. A real deployment runs three or more with `min.insync.replicas=2`.
  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    networks:
      - app-network
    ports:
      # The HOST listener, not the internal one. `kafka:9092` is what containers
      # on app-network use and is unresolvable outside it.
      - "${KAFKA_PORT:-29092}:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      # Two listeners because the container and the host reach the broker at
      # different addresses, and a client is redirected to whatever the broker
      # advertises: `kafka:9092` is unresolvable from the host, and
      # `localhost:9092` is the wrong machine from inside the network.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:${KAFKA_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # All three default to 3 and would leave the internal topics unable to
      # create themselves on a one-node cluster.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Kafka waits this long before the first rebalance of a new group, to
      # avoid one per member as a deployment rolls out. Useful in production,
      # three seconds of dead time per group locally.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-5L6g3nShT-eMCtK--X86sw}
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis2:
        condition: service_healthy
      redis3:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-4000}
      # Resolved to the internal service hostname — not localhost
      DATABASE_URL: >-
        postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-app_db}
      REDIS_URL: redis://redis:6379
      # `NODE_ENV=production` above refuses every in-memory backend, which is
      # the whole point of those rules — a default that is right for a test and
      # catastrophic in production must not be able to reach production. The
      # compose file therefore has to name a real one for each.
      STORAGE_ADAPTER: ${STORAGE_ADAPTER:-local}
      STORAGE_LOCAL_ROOT: ${STORAGE_LOCAL_ROOT:-/app/storage}
      IDEMPOTENCY_STORE: ${IDEMPOTENCY_STORE:-redis}
      DISTRIBUTED_LOCK: ${DISTRIBUTED_LOCK:-redlock}
      REDLOCK_NODES: ${REDLOCK_NODES:-redis://redis:6379,redis://redis2:6379,redis://redis3:6379}
      # Same rule for the broker: MESSAGE_BROKER=memory is refused in production
      # once OUTBOX_PUBLISHER=broker depends on it, so both have to be named.
      OUTBOX_PUBLISHER: ${OUTBOX_PUBLISHER:-broker}
      MESSAGE_BROKER: ${MESSAGE_BROKER:-kafka}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      # JWT — override JWT_SECRET in production; default is only for local dev
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-min-32-chars!!}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-15m}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-7d}
      # OAuth (optional — leave empty to disable Google login)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:4000/v1/auth/google/callback}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "${PORT:-4000}:4000"
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - >-
          require('http').get(
            'http://localhost:4000/v1/health',
            r => process.exit(r.statusCode === 200 ? 0 : 1)
          ).on('error', () => process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

# ─── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  pgdata:
  redisdata:
  redis2data:
  redis3data:
  kafkadata:
