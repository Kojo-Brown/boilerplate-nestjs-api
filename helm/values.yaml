replicaCount: 1

image:
  repository: ghcr.io/kojo-brown/boilerplate-nestjs-api
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: api.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

livenessProbe:
  httpGet:
    path: /v1/health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /v1/health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

volumes:
  - name: tmp
    emptyDir: {}

volumeMounts:
  - name: tmp
    mountPath: /tmp

nodeSelector: {}

tolerations: []

affinity: {}

env:
  NODE_ENV: production
  PORT: "3000"
  API_VERSION: v1
  # Field-level encryption for orders.itemsCiphertext. `kms` because this chart
  # deploys to production: the `local` provider boots there but keeps the master
  # key in the pod's environment, with no per-use audit trail and no rotation
  # without a redeploy. Set secret.ENCRYPTION_KMS_KEY_ID below — the boot fails
  # naming it if you do not — and give the service account a role that may
  # kms:GenerateDataKey and kms:Decrypt with that key. See
  # docs/field-encryption.md.
  ENCRYPTION_KEY_PROVIDER: kms

# Sensitive values — override via --set or external secret manager
secret:
  DATABASE_URL: ""
  JWT_SECRET: ""
  JWT_REFRESH_SECRET: ""
  REDIS_URL: ""
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_S3_BUCKET: ""
  AWS_REGION: ""
  # Not a secret — a key id or an alias is not sensitive — but listed here
  # because this block is the one whose empty entries are omitted rather than
  # rendered as "", and an absent variable produces a boot error that names it
  # while an empty one would look configured. An alias is usually right:
  # re-pointing it rotates the key with no deploy.
  ENCRYPTION_KMS_KEY_ID: ""
  # Only for ENCRYPTION_KEY_PROVIDER=local. 32 bytes, base64. Rotating it is a
  # re-encryption pass, not an edit: rows written under the old key stop being
  # readable.
  ENCRYPTION_LOCAL_MASTER_KEY: ""

postgresql:
  enabled: false
  auth:
    username: nestjs
    password: changeme
    database: nestjs_api

redis:
  enabled: false
  auth:
    enabled: false
